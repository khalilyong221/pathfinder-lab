<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PathFinder Lab · 寻路算法可视化实验室</title>
<style>
  :root{
    --bg: #0b0f19;
    --panel: #111827;
    --panel-2: #161f30;
    --border: #232d42;
    --text: #e6e9f2;
    --muted: #8792a8;
    --accent: #3b82f6;
    --accent-2: #22d3ee;
    --wall: #1f2937;
    --wall-border: #374357;
    --visited: #1e3a5f;
    --visited-2: #2f6fb8;
    --path: #f5c542;
    --start: #22c55e;
    --end: #ef4444;
    --danger: #ef4444;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: var(--accent-2); }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(59,130,246,0.06), transparent);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo{
    width:36px; height:36px; border-radius:9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; color:#08111f;
  }
  .brand h1{ font-size:16px; margin:0; letter-spacing:.2px; }
  .brand p{ font-size:11px; margin:2px 0 0; color:var(--muted); letter-spacing:.4px; text-transform:uppercase; }
  .badge{
    font-size:11px; color: var(--accent-2); border:1px solid rgba(34,211,238,.35);
    background: rgba(34,211,238,.08); padding:4px 10px; border-radius:999px;
  }

  .layout{ display:grid; grid-template-columns: 280px 1fr; gap:20px; padding:20px 24px 32px; max-width:1400px; margin:0 auto; }
  @media (max-width: 900px){ .layout{ grid-template-columns: 1fr; } }

  .panel{
    background: var(--panel); border:1px solid var(--border); border-radius: var(--radius);
    padding:16px;
  }
  .panel + .panel{ margin-top:16px; }
  .panel h2{
    font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);
    margin:0 0 12px; font-weight:700;
  }

  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  select, input[type=range]{
    width:100%; background: var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:9px 10px; font-size:13px; outline:none;
  }
  select:focus{ border-color: var(--accent); }

  .btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background: var(--panel-2); color: var(--text); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; font-size:13px; cursor:pointer; margin-top:8px;
    transition: border-color .15s ease, transform .05s ease, background .15s ease;
  }
  .btn:hover{ border-color: var(--accent); background:#1a2436; }
  .btn:active{ transform: translateY(1px); }
  .btn.primary{
    background: linear-gradient(135deg, var(--accent), #2563eb); border-color: transparent; color:white; font-weight:600;
  }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.danger{ color:#fca5a5; }
  .btn.danger:hover{ border-color: var(--danger); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .row{ display:flex; gap:8px; }
  .row .btn{ margin-top:0; }

  .field{ margin-top:12px; }
  .field:first-child{ margin-top:0; }
  .speed-label{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:6px; }

  .legend{ display:flex; flex-direction:column; gap:8px; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .swatch{ width:14px; height:14px; border-radius:4px; border:1px solid var(--border); flex:none; }

  .stats{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .stat{ background: var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:10px; }
  .stat .v{ font-size:20px; font-weight:700; font-variant-numeric: tabular-nums; }
  .stat .k{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }

  .board-wrap{ display:flex; flex-direction:column; gap:14px; }
  .board-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .board-head h2{ margin:0; font-size:15px; }
  .board-head p{ margin:2px 0 0; font-size:12px; color: var(--muted); }
  .hint{ font-size:11px; color: var(--muted); }

  .board{
    background: var(--panel); border:1px solid var(--border); border-radius: var(--radius);
    padding:14px; overflow:auto;
  }
  #grid{
    display:grid; gap:1px; background: var(--border); border-radius:6px; overflow:hidden;
    width: fit-content; margin: 0 auto; user-select:none;
  }
  .cell{
    width:22px; height:22px; background: #0e1524; position:relative;
    transition: background-color .12s ease;
  }
  .cell.wall{ background: var(--wall); box-shadow: inset 0 0 0 1px var(--wall-border); }
  .cell.start{ background: var(--start); }
  .cell.end{ background: var(--end); }
  .cell.visited{ animation: visitPop .35s ease forwards; }
  .cell.path{ animation: pathPop .35s ease forwards; }

  @keyframes visitPop{
    0%{ background: rgba(59,130,246,.15); transform: scale(.65); border-radius:8px; }
    60%{ background: var(--visited-2); transform: scale(1.05); }
    100%{ background: var(--visited); transform: scale(1); border-radius:2px; }
  }
  @keyframes pathPop{
    0%{ background: var(--visited); transform: scale(.75); }
    50%{ transform: scale(1.25); }
    100%{ background: var(--path); transform: scale(1); }
  }

  footer{ text-align:center; padding:18px; color: var(--muted); font-size:11px; }
  footer a{ color: var(--muted); text-decoration: underline; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border:1px solid var(--border); color: var(--text);
    padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease; z-index: 50;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">PF</div>
    <div>
      <h1>PathFinder Lab</h1>
      <p>Pathfinding Algorithm Visualizer</p>
    </div>
  </div>
  <span class="badge">● 纯前端 · 零依赖</span>
</div>

<div class="layout">

  <!-- Controls -->
  <div>
    <div class="panel">
      <h2>算法</h2>
      <div class="field">
        <label for="algo">选择寻路算法</label>
        <select id="algo">
          <option value="astar">A* 搜索（曼哈顿距离启发式）</option>
          <option value="dijkstra">Dijkstra 最短路径</option>
          <option value="bfs">广度优先搜索 BFS</option>
          <option value="dfs">深度优先搜索 DFS</option>
        </select>
      </div>
      <div class="field">
        <label>动画速度</label>
        <input type="range" id="speed" min="1" max="4" value="3" step="1" />
        <div class="speed-label"><span>慢</span><span>快</span></div>
      </div>
      <div class="field">
        <button class="btn primary" id="visualize">▶ 开始可视化</button>
      </div>
    </div>

    <div class="panel">
      <h2>网格操作</h2>
      <button class="btn" id="maze">🧩 生成随机迷宫</button>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="clearWalls">清除墙体</button>
        <button class="btn danger" id="reset">重置全部</button>
      </div>
      <p class="hint" style="margin-top:10px">拖动绿色/红色格子可移动起点和终点；按住鼠标左键拖动可绘制墙体。</p>
    </div>

    <div class="panel">
      <h2>运行结果</h2>
      <div class="stats">
        <div class="stat"><div class="v" id="statVisited">0</div><div class="k">访问节点</div></div>
        <div class="stat"><div class="v" id="statPath">0</div><div class="k">路径长度</div></div>
        <div class="stat"><div class="v" id="statTime">0ms</div><div class="k">求解耗时</div></div>
        <div class="stat"><div class="v" id="statFound">—</div><div class="k">是否可达</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>图例</h2>
      <div class="legend">
        <div class="legend-item"><span class="swatch" style="background:var(--start)"></span>起点</div>
        <div class="legend-item"><span class="swatch" style="background:var(--end)"></span>终点</div>
        <div class="legend-item"><span class="swatch" style="background:var(--wall)"></span>墙体（不可通过）</div>
        <div class="legend-item"><span class="swatch" style="background:var(--visited)"></span>已探索节点</div>
        <div class="legend-item"><span class="swatch" style="background:var(--path)"></span>最短路径</div>
      </div>
    </div>
  </div>

  <!-- Board -->
  <div class="board-wrap">
    <div class="board-head">
      <div>
        <h2>可视化网格</h2>
        <p>BFS / DFS / Dijkstra / A* 在同一张网格上逐帧展示搜索过程</p>
      </div>
      <span class="hint" id="gridInfo"></span>
    </div>
    <div class="board">
      <div id="grid"></div>
    </div>
  </div>

</div>

<footer>
  PathFinder Lab · 用于演示算法实现与前端交互能力的开源 Demo · MIT License
</footer>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- Config ----------
  const ROWS = 21;
  const COLS = 45;
  const CELL_PX = 22;

  const SPEED_MS = { 1: 40, 2: 20, 3: 8, 4: 2 };

  let START = { row: 9, col: 7 };
  let END   = { row: 9, col: 37 };

  // ---------- State ----------
  let grid = [];               // grid[row][col] = node
  let cellEls = [];             // matching DOM elements
  let isMouseDown = false;
  let dragTarget = null;        // 'start' | 'end' | null
  let isRunning = false;

  const gridEl = document.getElementById('grid');
  const toastEl = document.getElementById('toast');
  const gridInfoEl = document.getElementById('gridInfo');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 1800);
  }

  // ---------- Node model ----------
  function createNode(row, col){
    return {
      row, col,
      isStart: row === START.row && col === START.col,
      isEnd: row === END.row && col === END.col,
      isWall: false,
      distance: Infinity,
      f: Infinity, g: Infinity, h: Infinity,
      isVisited: false,
      previousNode: null,
    };
  }

  function buildGrid(){
    grid = [];
    for(let r=0; r<ROWS; r++){
      const rowArr = [];
      for(let c=0; c<COLS; c++){
        rowArr.push(createNode(r,c));
      }
      grid.push(rowArr);
    }
  }

  function renderGrid(){
    gridEl.style.gridTemplateColumns = `repeat(${COLS}, ${CELL_PX}px)`;
    gridEl.innerHTML = '';
    cellEls = [];
    for(let r=0; r<ROWS; r++){
      const rowEls = [];
      for(let c=0; c<COLS; c++){
        const div = document.createElement('div');
        div.className = 'cell';
        div.dataset.row = r;
        div.dataset.col = c;
        applyCellClass(div, grid[r][c]);
        div.addEventListener('mousedown', onCellMouseDown);
        div.addEventListener('mouseenter', onCellMouseEnter);
        div.addEventListener('mouseup', onCellMouseUp);
        gridEl.appendChild(div);
        rowEls.push(div);
      }
      cellEls.push(rowEls);
    }
    gridInfoEl.textContent = `${ROWS} × ${COLS} 网格 · ${ROWS*COLS} 个节点`;
  }

  function applyCellClass(el, node){
    el.className = 'cell';
    if(node.isStart) el.classList.add('start');
    else if(node.isEnd) el.classList.add('end');
    else if(node.isWall) el.classList.add('wall');
  }

  document.addEventListener('mouseup', ()=>{ isMouseDown = false; dragTarget = null; });

  function onCellMouseDown(e){
    if(isRunning) return;
    const r = +e.currentTarget.dataset.row, c = +e.currentTarget.dataset.col;
    isMouseDown = true;
    const node = grid[r][c];
    if(node.isStart){ dragTarget = 'start'; return; }
    if(node.isEnd){ dragTarget = 'end'; return; }
    toggleWall(r,c);
  }
  function onCellMouseEnter(e){
    if(!isMouseDown || isRunning) return;
    const r = +e.currentTarget.dataset.row, c = +e.currentTarget.dataset.col;
    if(dragTarget === 'start'){ moveEndpoint('start', r, c); return; }
    if(dragTarget === 'end'){ moveEndpoint('end', r, c); return; }
    toggleWall(r,c,true);
  }
  function onCellMouseUp(){ isMouseDown = false; dragTarget = null; }

  function toggleWall(r,c, forceOn){
    const node = grid[r][c];
    if(node.isStart || node.isEnd) return;
    node.isWall = forceOn ? true : !node.isWall;
    applyCellClass(cellEls[r][c], node);
  }

  function moveEndpoint(which, r, c){
    const node = grid[r][c];
    if(node.isWall) return;
    if(which === 'start'){
      if(node.isEnd) return;
      grid[START.row][START.col].isStart = false;
      applyCellClass(cellEls[START.row][START.col], grid[START.row][START.col]);
      START = { row:r, col:c };
      node.isStart = true;
    } else {
      if(node.isStart) return;
      grid[END.row][END.col].isEnd = false;
      applyCellClass(cellEls[END.row][END.col], grid[END.row][END.col]);
      END = { row:r, col:c };
      node.isEnd = true;
    }
    applyCellClass(cellEls[r][c], node);
  }

  function clearPathVisuals(){
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const node = grid[r][c];
        node.isVisited = false;
        node.distance = Infinity;
        node.f = Infinity; node.g = Infinity; node.h = Infinity;
        node.previousNode = null;
        const el = cellEls[r][c];
        el.style.animation = 'none';
        applyCellClass(el, node);
      }
    }
  }

  function clearWalls(){
    for(let r=0;r<ROWS;r++)
      for(let c=0;c<COLS;c++)
        grid[r][c].isWall = false;
    clearPathVisuals();
  }

  function resetAll(){
    START = { row: 9, col: 7 };
    END = { row: 9, col: 37 };
    buildGrid();
    renderGrid();
    updateStats({visited:0, path:0, time:0, found:null});
  }

  function neighbors(node){
    const {row, col} = node;
    const deltas = [[-1,0],[1,0],[0,-1],[0,1]];
    const result = [];
    for(const [dr,dc] of deltas){
      const nr = row+dr, nc = col+dc;
      if(nr>=0 && nr<ROWS && nc>=0 && nc<COLS && !grid[nr][nc].isWall){
        result.push(grid[nr][nc]);
      }
    }
    return result;
  }

  // ---------- Algorithms ----------
  // All return { visitedInOrder: Node[], path: Node[] }

  function bfs(startNode, endNode){
    const visitedInOrder = [];
    const queue = [startNode];
    startNode.isVisited = true;
    while(queue.length){
      const current = queue.shift();
      visitedInOrder.push(current);
      if(current === endNode) break;
      for(const nb of neighbors(current)){
        if(!nb.isVisited){
          nb.isVisited = true;
          nb.previousNode = current;
          queue.push(nb);
        }
      }
    }
    return { visitedInOrder, path: buildPath(endNode) };
  }

  function dfs(startNode, endNode){
    const visitedInOrder = [];
    const stack = [startNode];
    while(stack.length){
      const current = stack.pop();
      if(current.isVisited) continue;
      current.isVisited = true;
      visitedInOrder.push(current);
      if(current === endNode) break;
      const nbs = neighbors(current);
      for(let i = nbs.length - 1; i >= 0; i--){
        const nb = nbs[i];
        if(!nb.isVisited){
          nb.previousNode = current;
          stack.push(nb);
        }
      }
    }
    return { visitedInOrder, path: buildPath(endNode) };
  }

  function dijkstra(startNode, endNode){
    const visitedInOrder = [];
    startNode.distance = 0;
    const unvisited = [];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(!grid[r][c].isWall) unvisited.push(grid[r][c]);

    while(unvisited.length){
      sortByDistance(unvisited);
      const closest = unvisited.shift();
      if(closest.distance === Infinity) break;
      closest.isVisited = true;
      visitedInOrder.push(closest);
      if(closest === endNode) break;
      for(const nb of neighbors(closest)){
        const tentative = closest.distance + 1;
        if(tentative < nb.distance){
          nb.distance = tentative;
          nb.previousNode = closest;
        }
      }
    }
    return { visitedInOrder, path: buildPath(endNode) };
  }
  function sortByDistance(arr){ arr.sort((a,b)=> a.distance - b.distance); }

  function heuristic(a,b){ return Math.abs(a.row-b.row) + Math.abs(a.col-b.col); }

  function astar(startNode, endNode){
    const visitedInOrder = [];
    startNode.g = 0;
    startNode.f = heuristic(startNode, endNode);
    const open = [startNode];
    const inOpen = new Set([startNode]);

    while(open.length){
      open.sort((a,b)=> a.f - b.f);
      const current = open.shift();
      inOpen.delete(current);
      if(current.isVisited) continue;
      current.isVisited = true;
      visitedInOrder.push(current);
      if(current === endNode) break;

      for(const nb of neighbors(current)){
        const tentativeG = current.g + 1;
        if(tentativeG < nb.g){
          nb.previousNode = current;
          nb.g = tentativeG;
          nb.h = heuristic(nb, endNode);
          nb.f = nb.g + nb.h;
          if(!inOpen.has(nb)){
            open.push(nb);
            inOpen.add(nb);
          }
        }
      }
    }
    return { visitedInOrder, path: buildPath(endNode) };
  }

  function buildPath(endNode){
    const path = [];
    let cur = endNode;
    if(!cur.previousNode && !cur.isStart) return path; // unreachable
    while(cur){
      path.unshift(cur);
      cur = cur.previousNode;
    }
    return path.length > 1 || path[0]?.isStart ? path : path;
  }

  const ALGORITHMS = { bfs, dfs, dijkstra, astar };
  const ALGO_LABEL = { bfs:'BFS', dfs:'DFS', dijkstra:'Dijkstra', astar:'A*' };

  // ---------- Maze generation (randomized recursive backtracker) ----------
  // Carves a perfect maze (fully connected, no cycles) on the odd/odd "room"
  // lattice inside the border, so it is connected by construction -- no
  // possibility of sealing start/end into an unreachable pocket.
  function setWallSafe(r,c,val){
    if(r<0||r>=ROWS||c<0||c>=COLS) return;
    const node = grid[r][c];
    if(node.isStart || node.isEnd) return;
    node.isWall = val;
  }

  function generateMaze(){
    if(isRunning) return;
    clearPathVisuals();

    // 1. fill everything with walls (start/end are protected automatically)
    for(let r=0;r<ROWS;r++)
      for(let c=0;c<COLS;c++)
        setWallSafe(r,c,true);

    // 2. build the room lattice (odd rows/cols inside the border)
    const roomRows = [];
    for(let r=1;r<ROWS-1;r+=2) roomRows.push(r);
    const roomCols = [];
    for(let c=1;c<COLS-1;c+=2) roomCols.push(c);

    const visited = new Set();
    const key = (r,c) => r + ',' + c;
    const carve = (r,c) => setWallSafe(r,c,false);

    const start = [
      roomRows[Math.floor(roomRows.length/2)],
      roomCols[Math.floor(roomCols.length/2)]
    ];
    const stack = [start];
    visited.add(key(start[0], start[1]));
    carve(start[0], start[1]);

    const dirs = [[-2,0],[2,0],[0,-2],[0,2]];

    // 3. randomized DFS (recursive backtracker) over the room lattice
    while(stack.length){
      const [r,c] = stack[stack.length-1];
      const options = [];
      for(const [dr,dc] of dirs){
        const nr = r+dr, nc = c+dc;
        if(nr>=1 && nr<ROWS-1 && nc>=1 && nc<COLS-1 && !visited.has(key(nr,nc))){
          options.push([nr,nc,dr,dc]);
        }
      }
      if(options.length === 0){ stack.pop(); continue; }
      const [nr,nc,dr,dc] = options[Math.floor(Math.random()*options.length)];
      carve(r + dr/2, c + dc/2); // knock down the wall between the two rooms
      carve(nr,nc);
      visited.add(key(nr,nc));
      stack.push([nr,nc]);
    }

    renderAllWalls();
    showToast('已生成随机迷宫');
  }

  function renderAllWalls(){
    for(let r=0;r<ROWS;r++)
      for(let c=0;c<COLS;c++)
        applyCellClass(cellEls[r][c], grid[r][c]);
  }

  // ---------- Animation / run ----------
  function updateStats({visited, path, time, found}){
    document.getElementById('statVisited').textContent = visited;
    document.getElementById('statPath').textContent = path;
    document.getElementById('statTime').textContent = time + 'ms';
    document.getElementById('statFound').textContent = found === null ? '—' : (found ? '是 ✅' : '否 ❌');
  }

  function setRunning(flag){
    isRunning = flag;
    document.getElementById('visualize').disabled = flag;
    document.getElementById('maze').disabled = flag;
    document.getElementById('clearWalls').disabled = flag;
    document.getElementById('algo').disabled = flag;
  }

  async function visualize(){
    if(isRunning) return;
    clearPathVisuals();

    const algoKey = document.getElementById('algo').value;
    const speed = document.getElementById('speed').value;
    const delay = SPEED_MS[speed];

    const startNode = grid[START.row][START.col];
    const endNode = grid[END.row][END.col];

    const t0 = performance.now();
    const { visitedInOrder, path } = ALGORITHMS[algoKey](startNode, endNode);
    const t1 = performance.now();

    setRunning(true);
    showToast(`正在运行 ${ALGO_LABEL[algoKey]} ...`);

    for(let i=0;i<visitedInOrder.length;i++){
      const node = visitedInOrder[i];
      if(node.isStart || node.isEnd) continue;
      await sleep(delay);
      const el = cellEls[node.row][node.col];
      el.style.animation = 'none';
      void el.offsetWidth;
      el.classList.add('visited');
    }

    const reachable = path.length > 0 && path[0] === startNode;
    if(reachable){
      for(const node of path){
        if(node.isStart || node.isEnd) continue;
        await sleep(Math.max(delay, 12));
        const el = cellEls[node.row][node.col];
        el.style.animation = 'none';
        void el.offsetWidth;
        el.classList.add('path');
      }
    }

    updateStats({
      visited: visitedInOrder.length,
      path: reachable ? path.length - 1 : 0,
      time: Math.round(t1 - t0),
      found: reachable
    });

    if(!reachable) showToast('未找到可达路径 —— 试试清除一些墙体');
    else showToast(`${ALGO_LABEL[algoKey]} 完成：路径长度 ${path.length-1}`);

    setRunning(false);
  }

  function sleep(ms){ return new Promise(res=> setTimeout(res, ms)); }

  // ---------- Wire up ----------
  document.getElementById('visualize').addEventListener('click', visualize);
  document.getElementById('maze').addEventListener('click', generateMaze);
  document.getElementById('clearWalls').addEventListener('click', ()=>{
    if(isRunning) return;
    clearWalls();
    showToast('已清除所有墙体');
  });
  document.getElementById('reset').addEventListener('click', ()=>{
    if(isRunning) return;
    resetAll();
    showToast('已重置网格');
  });

  // init
  buildGrid();
  renderGrid();

  // expose for automated testing
  window.__pathfinderLab = { visualize, generateMaze, clearWalls, resetAll, ALGORITHMS };
})();
</script>
